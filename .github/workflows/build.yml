name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Import signing identity (stable across releases → TCC grants survive updates)
        if: env.MACOS_SIGNING_P12 != ''
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASS: ${{ secrets.MACOS_SIGNING_PASS }}
        run: |
          echo "$MACOS_SIGNING_P12" | base64 -d > /tmp/sign.p12
          security create-keychain -p build /tmp/build.keychain
          security list-keychains -s /tmp/build.keychain
          security unlock-keychain -p build /tmp/build.keychain
          security import /tmp/sign.p12 -k /tmp/build.keychain -P "$MACOS_SIGNING_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build /tmp/build.keychain
          rm /tmp/sign.p12

      - name: Build (universal arm64 + amd64)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          VER="${GITHUB_REF_NAME#v}"; VER="${VER:-dev}"
          wails build -clean -s -platform darwin/universal \
            -ldflags "-X main.AppVersion=${VER}"
          # stable cert when available (adhoc = per-build CDHash = users
          # must re-grant mic/input-monitoring/accessibility every update)
          SIGN_ID=$(security find-identity -v -p codesigning 2>/dev/null | sed -n 's/.*"\(gemini-dictation-release\)".*/\1/p' | head -1)
          codesign --force --deep --sign "${SIGN_ID:--}" \
            -i vn.ops4vn.gemini-dictation \
            "build/bin/Gemini Dictation.app"

      - name: Package
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME:-dev}"; VER="${VER#v}"
          cd build/bin
          ditto -c -k --keepParent "Gemini Dictation.app" \
            "gemini-dictation-${VER}-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gemini-dictation-macos
          path: build/bin/*.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Ensure C compiler (CGO for malgo/miniaudio)
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          gcc --version

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          VER="${GITHUB_REF_NAME:-dev}"; VER="${VER#v}"
          wails build -clean -s -ldflags "-X main.AppVersion=${VER}"

      - name: Package
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME:-dev}"; VER="${VER#v}"
          cd build/bin
          7z a "gemini-dictation-${VER}-windows-x64.zip" "Gemini Dictation.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: gemini-dictation-windows
          path: build/bin/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Manifest + checksums
        working-directory: dist
        run: |
          VER="${GITHUB_REF_NAME}"
          MAC=$(ls *macos*.zip)
          MSHA=$(shasum -a 256 "$MAC" | cut -d' ' -f1)
          WIN=$(ls *windows*.zip)
          WSHA=$(shasum -a 256 "$WIN" | cut -d' ' -f1)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VER}"
          cat > latest.json <<EOF
          {
            "version": "${VER#v}",
            "macos": { "sha256": "${MSHA}", "url": "${BASE}/${MAC}" },
            "windows": { "sha256": "${WSHA}", "url": "${BASE}/${WIN}" }
          }
          EOF
          shasum -a 256 "$MAC" "$WIN" > checksums.txt
          cat latest.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/latest.json
            dist/checksums.txt
