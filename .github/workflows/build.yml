name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build (universal arm64 + amd64)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          wails build -clean -s -platform darwin/universal \
            -ldflags "-X main.AppVersion=${VER}"

      - name: Package
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          cd build/bin
          ditto -c -k --keepParent "Gemini Dictation.app" \
            "gemini-dictation-${VER}-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gemini-dictation-macos
          path: build/bin/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Manifest + checksums
        working-directory: dist
        run: |
          VER="${GITHUB_REF_NAME}"
          MAC=$(ls *macos*.zip)
          MSHA=$(shasum -a 256 "$MAC" | cut -d' ' -f1)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VER}"
          cat > latest.json <<EOF
          {
            "version": "${VER#v}",
            "macos": { "sha256": "${MSHA}", "url": "${BASE}/${MAC}" }
          }
          EOF
          shasum -a 256 "$MAC" > checksums.txt
          cat latest.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/latest.json
            dist/checksums.txt
