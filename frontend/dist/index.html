<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#14161c; --dim:#9aa3b5; --text:#f2f4f8 }
  * { margin:0; box-sizing:border-box }
  /* full-bleed dark: if macOS transparency breaks again the pill degrades
     to a square dark pill — never a white rectangle */
  html, body { background:var(--bg); overflow:hidden; height:100%;
    -webkit-user-select:none; user-select:none; cursor:default }
  #pill { display:none; align-items:center; justify-content:center; gap:8px; height:100%; width:100%;
    padding:0 12px; background:var(--bg); border-radius:10px;
    font:12px -apple-system,system-ui,sans-serif; color:var(--text) }
  body.rec #pill, body.busy #pill { display:flex }
  #dot { width:7px; height:7px; border-radius:50%; background:#ff5f57; flex:none }
  #wave { display:flex; align-items:center; gap:3px; height:18px }
  #wave i { width:3px; border-radius:1.5px; background:rgba(255,255,255,.95); height:4px }
  #timer { font-variant-numeric:tabular-nums; white-space:nowrap }
  #spin { display:none; width:13px; height:13px; border:2px solid rgba(255,255,255,.25);
    border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; flex:none }
  @keyframes sp { to { transform:rotate(360deg) } }
  body.busy #wave, body.busy #dot { display:none }
  body.busy #spin { display:block }
</style>
</head>
<body>
  <div id="pill">
    <div id="dot"></div>
    <div id="wave"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div id="spin"></div>
    <span id="timer">0:00</span>
  </div>
<script>
const state = { rec:false, t0:0 };
const bars = [...document.querySelectorAll('#wave i')];
const levels = Array(6).fill(0.12);

function render() {
  for (let i = 0; i < 6; i++) {
    bars[i].style.height = Math.max(3, levels[i] * 18) + 'px';
  }
}
function push(l) { levels.shift(); levels.push(Math.max(0.1, Math.min(1, l))); }

function fmt(s) { s = Math.max(0, Math.floor(s)); return (s/60|0) + ':' + String(s%60).padStart(2,'0'); }

setInterval(async () => {
  if (state.rec) {
    try { push(await window.go.main.App.GetLevel()); } catch {}
    document.getElementById('timer').textContent = fmt((Date.now()/1000) - state.t0);
  }
  render();
}, 60);

window.runtime.EventsOn('pill', (s) => {
  document.body.className = s.state;
  if (s.state === 'rec') { state.rec = true; state.t0 = s.t0 || Date.now()/1000; }
  else { state.rec = false; }
});
window.go.main.App.GetInfo();
</script>
</body>
</html>
